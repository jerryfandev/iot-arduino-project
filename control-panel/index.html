<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ESP Control Panel</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <div class="min-vh-100 d-flex align-items-center py-4">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-9 col-lg-6">
            <div class="card shadow-sm border-0">
              <div class="card-body p-4 p-sm-5">
                <div class="d-flex align-items-start justify-content-between gap-3 mb-3">
                  <div>
                    <h1 class="h4 mb-1">ESP Control Panel</h1>
                    <p class="text-body-secondary mb-0">
                      Giao diện web tĩnh (chưa gọi API).
                    </p>
                  </div>
                  <span class="badge rounded-pill text-bg-secondary" id="connectionBadge">
                    Offline
                  </span>
                </div>

                <div class="rounded-4 p-3 p-sm-4 control-surface">
                  <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                    <div>
                      <div class="fw-semibold">Đèn</div>
                      <div class="text-body-secondary small" id="lampStatusText">Đang tắt</div>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                      <div class="form-check form-switch m-0">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          role="switch"
                          id="lampToggle"
                          aria-label="Bật/Tắt đèn"
                        />
                      </div>

                      <button class="btn btn-primary btn-lg px-4" id="lampButton" type="button">
                        Bật
                      </button>
                    </div>
                  </div>

                  <hr class="my-4" />

                  <div class="d-flex align-items-start justify-content-between gap-3">
                    <div class="small text-body-secondary">
                      Tip: mở trên điện thoại là đẹp nhất. Sau này chỉ cần gắn API vào hàm
                      <code>sendLampState()</code>.
                    </div>
                    <button class="btn btn-outline-secondary btn-sm" id="resetUiBtn" type="button">
                      Reset UI
                    </button>
                  </div>
                </div>

                <div class="mt-3 small text-body-secondary">
                  Trạng thái UI:
                  <span class="font-monospace" id="debugState">lamp=off</span>
                </div>
              </div>
            </div>

            <div class="text-center mt-3 small text-body-secondary">
              Static HTML + JS thuần • Bootstrap 5
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./assets/js/app.js" defer></script>
  </body>
</html>
